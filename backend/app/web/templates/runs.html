{% extends "base.html" %}
{% block title %}Runs — FTDC Analyzer{% endblock %}
{% block content %}
<section class="card">
  <h1>Analysis Runs</h1>
  {% if runs %}
  <ul class="run-list">
    {% for run_id in runs %}
    <li><a href="/runs/{{ run_id }}">{{ run_id }}</a></li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="muted">No runs found under <code>simagix-workspace/exports/mongo-ftdc/</code>.</p>
  {% endif %}
</section>
{% endblock %}
