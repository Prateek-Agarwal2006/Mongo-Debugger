# Grafana + mongo-ftdc API for interactive FTDC charts.
# Usage (from project root):
#   simagix-workspace/scripts/build-ftdc-local.sh   # once — patched mftdc -server
#   docker compose -f simagix-workspace/docker/grafana-compose.yaml up -d --build
#
# FTDC starts with no diagnostic.data; load per run via POST /grafana/dir (see run page Load FTDC).

services:
  grafana-ftdc:
    build:
      context: ../repos/mongo-ftdc
      dockerfile: grafana/Dockerfile
    image: mongo-debugger-grafana-ftdc:local
    hostname: grafana-ftdc
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    environment:
      GF_PLUGINS_PREINSTALL: simpod-json-datasource
      GF_LOG_LEVEL: error
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ../grafana/dashboards/anomaly-focus.json:/var/lib/grafana/dashboards/anomaly-focus.json:ro
    depends_on:
      - ftdc

  ftdc:
    image: mongo-debugger/ftdc:local
    hostname: ftdc
    restart: unless-stopped
    ports:
      - "${FTDC_PORT:-5408}:5408"
    volumes:
      - ../../:/workspace
    command: /mftdc -server -latest 0
