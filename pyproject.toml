[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-ftdc-rca"
version = "0.1.0"
description = "MongoDB Simagix evidence-bundle RCA backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
prod = [
    "psycopg[binary,pool]>=3.2.0",
]
ftdc = [
    "duckdb>=1.1.0",
    "numpy>=2.0.0",
    "pyftdc>=0.3.3",
]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]
llm = [
    "google-adk>=1.35.0",
    "mcp>=1.27.0",
    "daytona>=0.198.0",
]
# cursor-sdk vendors a Node runtime and node_modules (undici 5.29.0), which
# Lacework fails on HIGH: CVE-2026-2229 and CVE-2026-1526 (both undici
# < 6.24.0). cursor-sdk 0.1.9 is the latest release and undici 5.29.0 is the
# final 5.x, so there is no version bump that clears it. Install this extra to
# use the Cursor provider outside the scanned image; backend/app/simagix/llm/
# providers/cursor/ is unchanged and works as soon as the SDK is present.
cursor = [
    "cursor-sdk>=0.1.7",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["tmp*", "_legacy*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
