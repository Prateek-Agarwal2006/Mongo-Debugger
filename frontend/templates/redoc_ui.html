{% extends "base.html" %}
{% block title %}API Reference (ReDoc) — FTDC Analyzer{% endblock %}
{% block head %}
<link rel="stylesheet" href="/static/css/redoc-theme.css"/>
{% endblock %}
{% block content %}
<div class="api-docs-hero card border-0 shadow-sm mb-4">
  <div class="card-body p-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div>
      <h1 class="h4 mb-1"><i class="bi bi-book me-2 text-success"></i>API Reference — ReDoc</h1>
      <p class="text-secondary small mb-0">Readable reference layout for the same OpenAPI schema.</p>
    </div>
    <a class="btn btn-sm btn-outline-success" href="/docs">
      <i class="bi bi-braces me-1"></i>Swagger UI
    </a>
  </div>
</div>
<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div id="redoc-container"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/redoc@2.1.3/bundles/redoc.standalone.js"></script>
<script>
Redoc.init("/openapi.json", {
  scrollYOffset: 72,
  hideDownloadButton: false,
  expandResponses: "200,201",
  theme: {
    colors: {
      primary: { main: "#13aa52" },
      success: { main: "#00ed64" },
      text: { primary: "#e7ecf3", secondary: "#9aa8b8" },
      border: { dark: "rgba(255,255,255,0.14)", light: "rgba(255,255,255,0.08)" },
      responses: {
        success: { color: "#00ed64", backgroundColor: "rgba(19,170,82,0.12)" },
        error: { color: "#f07178", backgroundColor: "rgba(240,113,120,0.12)" },
        redirect: { color: "#f0ad4e", backgroundColor: "rgba(240,173,78,0.12)" },
        info: { color: "#3d8bfd", backgroundColor: "rgba(61,139,253,0.12)" },
      },
      http: {
        get: "#3d8bfd",
        post: "#13aa52",
        put: "#f0ad4e",
        delete: "#f07178",
      },
    },
    typography: {
      fontSize: "15px",
      fontFamily: "DM Sans, system-ui, sans-serif",
      headings: { fontFamily: "DM Sans, system-ui, sans-serif", color: "#e7ecf3" },
      code: {
        fontFamily: "JetBrains Mono, ui-monospace, monospace",
        fontSize: "13px",
        color: "#b8e0c8",
        backgroundColor: "#1a2330",
      },
      links: { color: "#00ed64", visited: "#00ed64", hover: "#5ff59a" },
    },
    sidebar: {
      backgroundColor: "#141b24",
      textColor: "#c8d4e0",
      activeTextColor: "#00ed64",
      groupItemsTextColor: "#9aa8b8",
      level1ItemsTextColor: "#e7ecf3",
      arrow: { color: "#9aa8b8" },
    },
    rightPanel: {
      backgroundColor: "#0b0f14",
      textColor: "#e7ecf3",
      servers: {
        overlay: { backgroundColor: "#141b24", textColor: "#e7ecf3" },
        url: { backgroundColor: "#1a2330" },
      },
    },
    codeBlock: {
      backgroundColor: "#080c10",
    },
    schema: {
      linesColor: "rgba(255,255,255,0.12)",
      defaultDetailsWidth: "75%",
      typeNameColor: "#9aa8b8",
      typeTitleColor: "#e7ecf3",
    },
  },
}, document.getElementById("redoc-container"));
</script>
{% endblock %}
