<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}FTDC Analyzer{% endblock %}</title>
  <link rel="icon" href="/static/unnamed.png" type="image/png"/>
  <link rel="apple-touch-icon" href="/static/unnamed.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/theme.css"/>
  <link rel="stylesheet" href="/static/css/motion.css"/>
  <link rel="stylesheet" href="/static/css/scroll-3d.css"/>
  {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100 {% block body_class %}{% endblock %}">
  <div class="app-bg" aria-hidden="true">
    <div class="app-bg-orb app-bg-orb--green"></div>
    <div class="app-bg-orb app-bg-orb--violet"></div>
    <div class="app-bg-grid"></div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary-subtle sticky-top app-navbar">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <span class="brand-icon"><i class="bi bi-database-gear"></i></span>
        <span>FTDC Analyzer</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-1">
          {% set path = request.url.path %}
          <li class="nav-item">
            <a class="nav-link{% if path == '/' %} active{% endif %}" href="/"><i class="bi bi-house-door me-1"></i>Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if path.startswith('/runs') %} active{% endif %}" href="/runs"><i class="bi bi-collection me-1"></i>Runs</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if path == '/upload' %} active{% endif %}" href="/upload"><i class="bi bi-cloud-upload me-1"></i>Upload</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if path.startswith('/docs') or path.startswith('/redoc') %} active{% endif %}" href="/docs"><i class="bi bi-braces me-1"></i>API</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-lg-4 py-4 flex-grow-1 app-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-top border-secondary-subtle py-3 mt-auto">
    <div class="container-fluid px-lg-4 d-flex flex-wrap justify-content-between align-items-center gap-2 text-secondary small">
      <span>Mongo Debugger — deterministic FTDC + agentic RCA</span>
      <a href="/docs" class="link-secondary" target="_blank" rel="noopener">OpenAPI docs</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="/static/js/motion.js" defer></script>
  <script src="/static/js/scroll-3d.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
