<!DOCTYPE html>
<html lang="en" data-app-theme="classic" data-bs-theme="dark">
<head>
  <meta charset="utf-8"/>
  <script>
    (function () {
      var t = localStorage.getItem("mdb-app-theme");
      if (t !== "classic" && t !== "modern") t = "classic";
      document.documentElement.dataset.appTheme = t;
      document.documentElement.setAttribute("data-bs-theme", t === "modern" ? "light" : "dark");
      if (t === "modern") {
        var v = "20260629-copyright-2026";
        var css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = "/static/modern/assets/index.css?v=" + v;
        css.id = "modern-bundle-css";
        document.head.appendChild(css);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}FTDC Analyzer{% endblock %}</title>
  <link rel="icon" href="/static/unnamed.png" type="image/png"/>
  <link rel="apple-touch-icon" href="/static/unnamed.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/stitch-nav.css?v=20260629-copyright-2026"/>
  <link rel="stylesheet" href="/static/css/theme.css"/>
  <link rel="stylesheet" href="/static/css/theme-modern.css"/>
  <link rel="stylesheet" href="/static/css/app-theme-toggle.css"/>
  <link rel="stylesheet" href="/static/css/motion.css"/>
  <link rel="stylesheet" href="/static/css/scroll-3d.css"/>
  <script src="/static/js/app-theme.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100 {% block body_class %}{% endblock %}">
  <script id="mdb-page-data" type="application/json">{% block page_data %}{"page":"unknown"}{% endblock %}</script>

  <div id="classic-chrome" class="d-flex flex-column min-vh-100 flex-grow-1 w-100">
    <div class="app-bg" aria-hidden="true">
      <div class="app-bg-orb app-bg-orb--green"></div>
      <div class="app-bg-orb app-bg-orb--violet"></div>
      <div class="app-bg-grid"></div>
      <div class="app-bg-modern-radial"></div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary-subtle sticky-top app-navbar">
      <div class="container-fluid px-lg-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
          <span class="brand-icon"><i class="bi bi-database-gear"></i></span>
          <span>FTDC Analyzer</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto gap-lg-1">
            {% set path = request.url.path %}
            <li class="nav-item">
              <a class="nav-link{% if path == '/' %} active{% endif %}" href="/"><i class="bi bi-house-door me-1"></i>Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if path.startswith('/runs') %} active{% endif %}" href="/runs"><i class="bi bi-collection me-1"></i>Runs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if path == '/upload' %} active{% endif %}" href="/upload"><i class="bi bi-cloud-upload me-1"></i>Upload</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if path == '/mcp-workarea' %} active{% endif %}" href="/mcp-workarea"><i class="bi bi-plug me-1"></i>MCP WorkArea</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if path == '/skill-workarea' %} active{% endif %}" href="/skill-workarea"><i class="bi bi-journal-code me-1"></i>Skill WorkArea</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if path.startswith('/docs') or path.startswith('/redoc') %} active{% endif %}" href="/docs"><i class="bi bi-braces me-1"></i>API</a>
            </li>
            <li class="nav-item d-flex align-items-center ms-lg-2 py-2 py-lg-0">
              <div data-app-theme-toggle="compact" aria-label="Theme switcher"></div>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container-fluid px-lg-4 py-4 flex-grow-1 app-main">
      {% block content %}{% endblock %}
    </main>

    <footer class="mdb-stitch-footer" aria-label="Site footer">
      <div class="mdb-stitch-footer__inner">
        <div class="mdb-stitch-footer__brand">
          <span class="mdb-stitch-footer__name">Mongo Debugger</span>
          <span class="mdb-stitch-footer__copy">© 2026 Mongo Debugger</span>
        </div>
        <div class="mdb-stitch-footer__links">
          <a class="mdb-stitch-footer__link" href="/docs" target="_blank" rel="noopener">API</a>
        </div>
      </div>
    </footer>
  </div>

  <div id="modern-app-root" class="modern-app-root" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="/static/js/motion.js" defer></script>
  <script src="/static/js/scroll-3d.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
