<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Phase 1 — Mongo Debugger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Material+Symbols+Outlined&display=swap" rel="stylesheet"/>
<style>
body { font-family: "Public Sans", sans-serif; background: #FAF9F5; }
.glass-panel { background: rgba(255,255,255,0.75); backdrop-filter: blur(16px); border: 1px solid #d2c3bf; border-radius: 0.75rem; }
.material-symbols-outlined { font-variation-settings: "FILL" 1; }
</style>
<link rel="stylesheet" href="/static/css/stitch-nav.css?v=20260629-copyright-2026"/>
</head>
<body class="min-h-screen flex flex-col">
<div id="mdb-stitch-nav-mount"></div>
<script src="/static/js/stitch-nav.js?v=20260629-copyright-2026"></script>
<main class="max-w-3xl mx-auto px-4 pt-24 pb-10 flex-grow w-full">
<h1 class="text-2xl font-bold mb-2">Phase 1 — Decode &amp; export</h1>
<p class="text-sm text-gray-600 mb-6" id="run-meta"></p>
<div class="glass-panel p-6 mb-4">
<div class="flex items-center gap-3 mb-4">
<span class="font-semibold">Phase 1 status</span>
<span id="status-badge" class="text-xs font-medium px-2 py-1 rounded-full bg-gray-200"></span>
</div>
<p id="job-message" class="text-sm text-gray-600"></p>
<p id="job-error" class="text-sm text-red-700 mt-3 hidden"></p>
</div>
<div id="success-banner" class="hidden glass-panel p-4 mb-4 bg-green-50 border-green-200 text-green-900 text-sm">
Phase 1 complete — <a id="phase2-link" href="#" target="_top" class="font-semibold underline">Start run analysis (Phase 2)</a>
</div>
<div id="poll-banner" class="hidden glass-panel p-4 text-sm text-blue-900 bg-blue-50">
Worker must be running: <code class="text-xs">uv run python -m backend.app.jobs.worker</code>
</div>
<div id="retry-banner" class="hidden glass-panel p-4 text-sm">
<button type="button" id="retry-btn" class="bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-medium">Retry Phase 1</button>
</div>
</main>
<div id="mdb-stitch-footer-mount"></div>
<script>
(function () {
  function readPageData() {
    try {
      const el = window.parent?.document?.getElementById("mdb-page-data");
      if (!el?.textContent) return null;
      return JSON.parse(el.textContent);
    } catch { return null; }
  }

  const data = readPageData();
  if (!data?.run_id) return;

  const runId = data.run_id;
  const status = data.pipeline_status || "queued";
  document.getElementById("run-meta").textContent =
    runId + (data.upload_time_utc ? " · " + data.upload_time_utc : "");

  const badge = document.getElementById("status-badge");
  const labels = {
    finished: "Complete",
    processing: "Decoding…",
    failed: "Failed",
    stale: "Not enqueued",
    queued: "Queued",
  };
  badge.textContent = labels[status] || status;

  if (data.job_id) {
    document.getElementById("job-message").textContent = "Job: " + data.job_id;
  }

  if (status === "finished") {
    document.getElementById("success-banner").classList.remove("hidden");
    const link = document.getElementById("phase2-link");
    link.href = "/runs/" + encodeURIComponent(runId);
  } else if (status === "queued" || status === "processing") {
    document.getElementById("poll-banner").classList.remove("hidden");
    if (data.job_id) {
      const poll = setInterval(async () => {
        const job = await fetch("/simagix/uploads/jobs/" + data.job_id).then((r) => r.json());
        document.getElementById("job-message").textContent = "Phase 1 " + job.state + ": " + job.message;
        if (job.state === "succeeded") {
          clearInterval(poll);
          window.top.location.href = "/runs/" + encodeURIComponent(runId);
        }
        if (job.state === "failed") {
          clearInterval(poll);
          window.top.location.reload();
        }
      }, 3000);
    }
  } else if (status === "failed" || status === "stale") {
    document.getElementById("retry-banner").classList.remove("hidden");
    document.getElementById("retry-btn").onclick = async () => {
      const resp = await fetch("/simagix/uploads/runs/" + runId + "/retry", { method: "POST" });
      if (!resp.ok) {
        const body = await resp.json().catch(() => ({}));
        alert(body.detail || "Retry failed");
        return;
      }
      window.top.location.reload();
    };
  }
})();
</script>
</body>
</html>
