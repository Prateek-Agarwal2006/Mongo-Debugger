<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Phase 1 — Mongo Debugger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Material+Symbols+Outlined&display=swap" rel="stylesheet"/>
<style>
body { font-family: "Public Sans", sans-serif; background: #FAF9F5; }
.glass-panel { background: rgba(255,255,255,0.75); backdrop-filter: blur(16px); border: 1px solid #d2c3bf; border-radius: 0.75rem; }
.material-symbols-outlined { font-variation-settings: "FILL" 1; }
.job-error-pre { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
</style>
<link rel="stylesheet" href="/static/css/stitch-nav.css?v=20260629-copyright-2026"/>
</head>
<body class="min-h-screen flex flex-col">
<div id="mdb-stitch-nav-mount"></div>
<script src="/static/js/stitch-nav.js?v=20260629-copyright-2026"></script>
<main class="max-w-3xl mx-auto px-4 pt-24 pb-10 flex-grow w-full">
<h1 class="text-2xl font-bold mb-2">Phase 1 — Decode &amp; export</h1>
<p class="text-sm text-gray-600 mb-6" id="run-meta"></p>
<div class="glass-panel p-6 mb-4">
<div class="flex items-center gap-3 mb-4">
<span class="font-semibold">Phase 1 status</span>
<span id="status-badge" class="text-xs font-medium px-2 py-1 rounded-full bg-gray-200"></span>
</div>
<p id="job-message" class="text-sm text-gray-600"></p>
<pre id="job-error" class="job-error-pre text-sm text-red-800 mt-3 p-3 rounded-lg bg-red-50 border border-red-200 hidden" aria-live="polite"></pre>
</div>
<div id="success-banner" class="hidden glass-panel p-4 mb-4 bg-green-50 border-green-200 text-green-900 text-sm">
Phase 1 complete — <a id="phase2-link" href="#" target="_top" class="font-semibold underline">Start run analysis (Phase 2)</a>
</div>
<div id="poll-banner" class="hidden glass-panel p-4 text-sm text-blue-900 bg-blue-50">
Worker must be running: <code class="text-xs">uv run python -m backend.app.jobs.worker</code>
</div>
<div id="retry-banner" class="hidden glass-panel p-4 text-sm">
<button type="button" id="retry-btn" class="bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-medium">Retry Phase 1</button>
</div>
</main>
<div id="mdb-stitch-footer-mount"></div>
<script src="/static/js/api-error-text.js"></script>
<script src="/static/js/page-data.js"></script>
<script>
(function () {
  function showJobError(text) {
    const el = document.getElementById("job-error");
    if (!el || !text) return;
    el.textContent = text;
    el.classList.remove("hidden");
  }

  const data = window.MdbPageData ? window.MdbPageData.readPageData() : null;
  if (!data?.run_id) return;

  const runId = data.run_id;
  const status = data.pipeline_status || "queued";
  document.getElementById("run-meta").textContent =
    runId + (data.upload_time_utc ? " · " + data.upload_time_utc : "");

  const badge = document.getElementById("status-badge");
  function progressLabel(st, message) {
    if (st === "finished") return "Ready";
    if (st === "failed") return "Failed";
    if (st === "queued") return "Queued";
    if (st === "stale") return "Stale";
    if (st === "processing") {
      return /ingest/i.test(message || "") ? "Loading metrics" : "Decoding";
    }
    return st;
  }
  badge.textContent = data.phase1_label || progressLabel(status, data.job_message);

  if (data.job_id) {
    document.getElementById("job-message").textContent = "Job: " + data.job_id;
  }
  if (data.job_message) {
    document.getElementById("job-message").textContent += " — " + data.job_message;
  }

  const embeddedError = window.MdbPageData?.readEmbeddedJobError?.();
  if (embeddedError) {
    showJobError(embeddedError);
  } else if (data.job_id && (status === "failed" || status === "stale")) {
    window.MdbPageData.fetchJob(data.job_id)
      .then((job) => showJobError(job.error || job.message || "Phase 1 failed"))
      .catch((err) => showJobError(err.message || String(err)));
  }

  if (status === "finished") {
    document.getElementById("success-banner").classList.remove("hidden");
    document.getElementById("phase2-link").href = "/runs/" + encodeURIComponent(runId);
  } else if (status === "queued" || status === "processing") {
    document.getElementById("poll-banner").classList.remove("hidden");
    if (data.job_id) {
      const poll = setInterval(async () => {
        try {
          const job = await window.MdbPageData.fetchJob(data.job_id);
          document.getElementById("job-message").textContent =
            "Phase 1 " + job.state + ": " + (job.message || "");
          badge.textContent = progressLabel(
            job.state === "running" ? "processing" : job.state === "pending" ? "queued" : status,
            job.message || ""
          );
          if (job.state === "succeeded") {
            clearInterval(poll);
            // Parent may already be /runs/{id} (gated pipeline) — reload to show RCA.
            const path = (window.top.location.pathname || "").replace(/\/$/, "");
            if (path === "/runs/" + runId) window.top.location.reload();
            else window.top.location.href = "/runs/" + encodeURIComponent(runId);
          }
          if (job.state === "failed") {
            clearInterval(poll);
            showJobError(job.error || job.message || "Phase 1 failed");
            badge.textContent = "Failed";
            document.getElementById("poll-banner").classList.add("hidden");
            document.getElementById("retry-banner").classList.remove("hidden");
          }
        } catch (err) {
          clearInterval(poll);
          showJobError(err.message || String(err));
          badge.textContent = "Failed";
          document.getElementById("poll-banner").classList.add("hidden");
          document.getElementById("retry-banner").classList.remove("hidden");
        }
      }, 3000);
    }
  } else if (status === "failed" || status === "stale") {
    document.getElementById("retry-banner").classList.remove("hidden");
    document.getElementById("retry-btn").onclick = async () => {
      const resp = await fetch("/simagix/uploads/runs/" + runId + "/retry", { method: "POST" });
      const { data: body, text } = await window.MdbVerbatimError.readResponseBody(resp);
      if (!resp.ok) {
        showJobError(window.MdbVerbatimError.errorFromBody(resp, body, text, "Retry failed"));
        return;
      }
      window.top.location.reload();
    };
  }
})();
</script>
</body>
</html>
