apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: mongo-debugger
nodes:
  - role: control-plane
    extraPortMappings:
      # Kind maps NodePort 30000 → localhost:8000 (ui nginx; API is ClusterIP)
      - containerPort: 30000
        hostPort: 8000
        protocol: TCP
      # Grafana NodePort 30300 → http://localhost:3030
      - containerPort: 30300
        hostPort: 3030
        protocol: TCP
  - role: worker
