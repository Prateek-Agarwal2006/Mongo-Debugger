apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: mongo-debugger
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: mongo-debugger-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mongo-debugger-secrets
                  key: DATABASE_URL
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mongo-debugger-secrets
                  key: CURSOR_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mongo-debugger-secrets
                  key: GOOGLE_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
