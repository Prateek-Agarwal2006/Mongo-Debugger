apiVersion: v1
kind: Secret
metadata:
  name: mongo-debugger-secrets
  labels:
    app.kubernetes.io/name: mongo-debugger
type: Opaque
stringData:
  DATABASE_URL: {{ include "mongo-debugger.databaseUrl" . | quote }}
  CURSOR_API_KEY: {{ .Values.secrets.cursorApiKey | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
  DAYTONA_API_KEY: {{ .Values.secrets.daytonaApiKey | default "" | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | default "password" | quote }}
