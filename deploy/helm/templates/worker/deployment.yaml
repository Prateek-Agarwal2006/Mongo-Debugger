apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: mongo-debugger
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # Init container copies the K8s-native pipeline scripts from the image
      # into /data/simagix-workspace/scripts/ so run_workspace.py finds them
      # at DATA_ROOT/simagix-workspace/scripts/run-mongo-ftdc-pipeline.sh.
      initContainers:
        - name: init-scripts
          image: {{ .Values.worker.image }}
          imagePullPolicy: {{ .Values.worker.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              mkdir -p /data/simagix-workspace/scripts
              cp /app/pipeline-scripts/*.sh /data/simagix-workspace/scripts/
              chmod +x /data/simagix-workspace/scripts/*.sh
              echo "Pipeline scripts staged at /data/simagix-workspace/scripts/"
          volumeMounts:
            - name: scratch
              mountPath: /data

      containers:
        - name: worker
          image: {{ .Values.worker.image }}
          imagePullPolicy: {{ .Values.worker.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: mongo-debugger-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mongo-debugger-secrets
                  key: DATABASE_URL
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mongo-debugger-secrets
                  key: CURSOR_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mongo-debugger-secrets
                  key: GOOGLE_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mongo-debugger-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: DAYTONA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mongo-debugger-secrets
                  key: DAYTONA_API_KEY
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: mongo-debugger-secrets
                  key: GOOGLE_CLOUD_PROJECT
                  optional: true
            - name: GOOGLE_CLOUD_LOCATION
              valueFrom:
                secretKeyRef:
                  name: mongo-debugger-secrets
                  key: GOOGLE_CLOUD_LOCATION
                  optional: true
            {{- if .Values.vertex.enabled }}
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ .Values.vertex.credentialsMountPath | quote }}
            {{- end }}
          volumeMounts:
            - name: scratch
              mountPath: /data
            {{- if .Values.vertex.enabled }}
            - name: gcp-sa
              mountPath: {{ .Values.vertex.credentialsMountDir | quote }}
              readOnly: true
            {{- end }}

      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.worker.scratchSizeLimit }}
        {{- if .Values.vertex.enabled }}
        - name: gcp-sa
          secret:
            secretName: mongo-debugger-secrets
            items:
              - key: {{ .Values.vertex.credentialsSecretKey }}
                path: {{ .Values.vertex.credentialsFileName }}
        {{- end }}
