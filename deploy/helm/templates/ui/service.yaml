apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: mongo-debugger
    app.kubernetes.io/component: ui
spec:
  type: NodePort
  selector:
    app: ui
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
      nodePort: {{ .Values.ui.nodePort }}
